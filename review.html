<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="UTF-8">

</head>

<body>

```
<!-- =========================
     NAVBAR
========================== -->

<header class="navbar">

    <button
        class="back-dashboard"
        type="button"
        onclick="window.location.href='restaurant.html'"
    >
        ← Kembali
    </button>

    <div class="nav-logo">
        Satu Meja
    </div>

</header>


<!-- =========================
     REVIEW PAGE
========================== -->

<main class="review-page">

    <p class="small-title">
        OUR FOOD JOURNEY
    </p>

    <h1>
        Tambah Review ♡
    </h1>

    <p
        id="review-restaurant"
        class="review-restaurant-name"
    >
        Memuat restoran...
    </p>


    <form id="review-form">


        <!-- =========================
             RATING
        ========================== -->

        <div class="form-group">

            <label>
                Kasih rating yuk
            </label>

            <div class="star-rating">

                <button
                    type="button"
                    data-rating="1"
                >☆</button>

                <button
                    type="button"
                    data-rating="2"
                >☆</button>

                <button
                    type="button"
                    data-rating="3"
                >☆</button>

                <button
                    type="button"
                    data-rating="4"
                >☆</button>

                <button
                    type="button"
                    data-rating="5"
                >☆</button>

            </div>

            <p id="rating-text">
                Belum ada rating
            </p>

        </div>


        <!-- =========================
             REVIEW TEXT
        ========================== -->

        <div class="form-group">

            <label for="review-text">
                Ceritain pengalamanmu
            </label>

            <textarea
                id="review-text"
                placeholder="Makanannya enak? Tempatnya nyaman? Ceritain di sini..."
                required
            ></textarea>

        </div>


        <!-- =========================
             PHOTO
        ========================== -->

        <div class="form-group">

            <label for="review-photo">
                Tambahkan foto
                <span>
                    (opsional, maksimal 5 foto)
                </span>
            </label>

            <input
                type="file"
                id="review-photo"
                accept="image/*"
                multiple
            >

            <p class="photo-hint">
                Kamu bisa pilih beberapa foto sekaligus ♡
            </p>

        </div>


        <!-- =========================
             PHOTO PREVIEW
        ========================== -->

        <div
            id="photo-preview"
            class="photo-preview"
        ></div>


        <!-- =========================
             SUBMIT
        ========================== -->

        <button
            type="submit"
            class="submit-review-button"
        >
            Simpan Review ♡
        </button>

    </form>

</main>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


<!-- =========================
     REVIEW PAGE SCRIPT
========================== -->

<script>

    window.selectedRating = 0;


    document.addEventListener(
        "DOMContentLoaded",
        async function () {


            // =========================
            // GET RESTAURANT ID
            // =========================

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const restaurantId =
                params.get("id");


            if (!restaurantId) {

                alert(
                    "Restoran tidak ditemukan."
                );

                window.location.href =
                    "index.html";

                return;

            }


            // =========================
            // LOAD RESTAURANT
            // =========================

            if (
                typeof supabaseClient !==
                "undefined"
            ) {

                const {
                    data: restaurant,
                    error
                } =
                    await supabaseClient
                        .from("restaurants")
                        .select(
                            "id, name"
                        )
                        .eq(
                            "id",
                            restaurantId
                        )
                        .single();


                if (
                    error ||
                    !restaurant
                ) {

                    console.error(
                        error
                    );

                    alert(
                        "Restoran tidak ditemukan."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                const restaurantName =
                    document.getElementById(
                        "review-restaurant"
                    );


                if (restaurantName) {

                    restaurantName.textContent =
                        restaurant.name;

                }

            }


            // =========================
            // RATING
            // =========================

            const stars =
                document.querySelectorAll(
                    ".star-rating button"
                );


            const ratingText =
                document.getElementById(
                    "rating-text"
                );


            stars.forEach(
                function (star) {

                    star.addEventListener(
                        "click",
                        function () {

                            window.selectedRating =
                                Number(
                                    this.dataset.rating
                                );


                            stars.forEach(
                                function (item) {

                                    const itemRating =
                                        Number(
                                            item.dataset.rating
                                        );


                                    item.textContent =
                                        itemRating <=
                                        window.selectedRating
                                            ? "★"
                                            : "☆";

                                }
                            );


                            if (ratingText) {

                                ratingText.textContent =
                                    window.selectedRating +
                                    " / 5";

                            }

                        }
                    );

                }
            );


            // =========================
            // PHOTO PREVIEW
            // =========================

            const photoInput =
                document.getElementById(
                    "review-photo"
                );


            const photoPreview =
                document.getElementById(
                    "photo-preview"
                );


            if (
                photoInput &&
                photoPreview
            ) {

                photoInput.addEventListener(
                    "change",
                    function () {

                        photoPreview.innerHTML =
                            "";


                        const files =
                            Array.from(
                                this.files
                            ).slice(0, 5);


                        files.forEach(
                            function (file) {

                                const reader =
                                    new FileReader();


                                reader.onload =
                                    function (event) {

                                        const img =
                                            document.createElement(
                                                "img"
                                            );


                                        img.src =
                                            event.target.result;


                                        img.alt =
                                            "Preview foto";


                                        photoPreview.appendChild(
                                            img
                                        );

                                    };


                                reader.readAsDataURL(
                                    file
                                );

                            }
                        );

                    }
                );

            }


            // =========================
            // SUBMIT REVIEW
            // =========================

            const reviewForm =
                document.getElementById(
                    "review-form"
                );


            if (!reviewForm) {
                return;
            }


            reviewForm.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    // =========================
                    // CHECK SUPABASE
                    // =========================

                    if (
                        typeof supabaseClient ===
                        "undefined"
                    ) {

                        alert(
                            "Koneksi database belum tersedia ♡"
                        );

                        return;

                    }


                    // =========================
                    // CHECK RATING
                    // =========================

                    const rating =
                        Number(
                            window.selectedRating
                        );


                    if (
                        !rating ||
                        rating < 1 ||
                        rating > 5
                    ) {

                        alert(
                            "Jangan lupa kasih rating dulu ♡"
                        );

                        return;

                    }


                    // =========================
                    // REVIEW TEXT
                    // =========================

                    const reviewText =
                        document.getElementById(
                            "review-text"
                        );


                    const text =
                        reviewText.value.trim();


                    if (!text) {

                        alert(
                            "Tulis review kamu dulu ya ♡"
                        );

                        return;

                    }


                    // =========================
                    // USER
                    // =========================

                    const {
                        data: userData,
                        error: userError
                    } =
                        await supabaseClient
                            .auth
                            .getUser();


                    const user =
                        userData &&
                        userData.user;


                    if (
                        userError ||
                        !user
                    ) {

                        alert(
                            "Kamu harus login terlebih dahulu."
                        );

                        return;

                    }


                    // =========================
                    // PROFILE
                    // =========================

                    const {
                        data: profile,
                        error: profileError
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select(
                                "name"
                            )
                            .eq(
                                "id",
                                user.id
                            )
                            .single();


                    if (
                        profileError ||
                        !profile
                    ) {

                        console.error(
                            profileError
                        );

                        alert(
                            "Data profile tidak ditemukan."
                        );

                        return;

                    }


                    // =========================
                    // RESTAURANT ID
                    // =========================

                    const params =
                        new URLSearchParams(
                            window.location.search
                        );


                    const restaurantId =
                        params.get("id");


                    if (!restaurantId) {

                        alert(
                            "Restoran tidak ditemukan."
                        );

                        return;

                    }


                    // =========================
                    // DISABLE BUTTON
                    // =========================

                    const submitButton =
                        reviewForm.querySelector(
                            'button[type="submit"]'
                        );


                    if (submitButton) {

                        submitButton.disabled =
                            true;

                        submitButton.textContent =
                            "Menyimpan...";

                    }


                    // =========================
                    // INSERT REVIEW
                    // =========================

                    const {
                        data: review,
                        error: reviewError
                    } =
                        await supabaseClient
                            .from("reviews")
                            .insert({
                                restaurant_id:
                                    restaurantId,

                                user_id:
                                    user.id,

                                user_name:
                                    profile.name,

                                rating:
                                    rating,

                                review_text:
                                    text
                            })
                            .select()
                            .single();


                    if (reviewError) {

                        console.error(
                            "Review gagal disimpan:",
                            reviewError
                        );


                        if (submitButton) {

                            submitButton.disabled =
                                false;

                            submitButton.textContent =
                                "Simpan Review ♡";

                        }


                        alert(
                            "Review gagal disimpan ♡"
                        );

                        return;

                    }


                    // =========================
                    // UPLOAD PHOTOS
                    // =========================

                    const files =
                        photoInput
                            ? Array.from(
                                photoInput.files
                            ).slice(0, 5)
                            : [];


                    for (
                        const file of files
                    ) {

                        try {

                            let uploadFile =
                                file;


                            // Compress jika fungsi tersedia
                            if (
                                typeof compressImage ===
                                "function"
                            ) {

                                uploadFile =
                                    await compressImage(
                                        file
                                    );

                            }


                            const fileName =
                                user.id +
                                "/" +
                                Date.now() +
                                "-" +
                                Math.random()
                                    .toString(36)
                                    .substring(
                                        2,
                                        8
                                    ) +
                                ".jpg";


                            const {
                                error:
                                    uploadError
                            } =
                                await supabaseClient
                                    .storage
                                    .from(
                                        "review-photos"
                                    )
                                    .upload(
                                        fileName,
                                        uploadFile,
                                        {
                                            contentType:
                                                "image/jpeg"
                                        }
                                    );


                            if (uploadError) {

                                console.error(
                                    "Upload foto gagal:",
                                    uploadError
                                );

                                continue;

                            }


                            // =========================
                            // SAVE PHOTO URL
                            // =========================

                            const {
                                error:
                                    photoError
                            } =
                                await supabaseClient
                                    .from(
                                        "review_photos"
                                    )
                                    .insert({
                                        review_id:
                                            review.id,

                                        photo_url:
                                            fileName
                                    });


                            if (photoError) {

                                console.error(
                                    "Data foto gagal disimpan:",
                                    photoError
                                );

                            }

                        } catch (error) {

                            console.error(
                                "Foto error:",
                                error
                            );

                        }

                    }


                    // =========================
                    // SUCCESS
                    // =========================

                    alert(
                        "Review berhasil disimpan ♡"
                    );


                    window.location.href =
                        "restaurant.html?id=" +
                        restaurantId;

                }
            );

        }
    );

</script>
