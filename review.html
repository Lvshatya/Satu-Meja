<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Review — Satu Meja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <button class="back-dashboard" type="button" onclick="window.location.href='restaurant.html'">
            ← Kembali
        </button>
        <div class="nav-logo">Satu Meja</div>
    </header>

    <main class="review-page">
        <p class="small-title">OUR FOOD JOURNEY</p>
        <h1>Tambah Review ♡</h1>
        <p id="review-restaurant" class="review-restaurant-name">Memuat restoran...</p>

        <form id="review-form">
            <div class="form-group">
                <label>Kasih rating yuk</label>
                <div class="star-rating">
                    <button type="button" data-rating="1">☆</button>
                    <button type="button" data-rating="2">☆</button>
                    <button type="button" data-rating="3">☆</button>
                    <button type="button" data-rating="4">☆</button>
                    <button type="button" data-rating="5">☆</button>
                </div>
                <p id="rating-text">Belum ada rating</p>
            </div>

            <div class="form-group">
                <label for="review-text">Ceritain pengalamanmu</label>
                <textarea id="review-text" placeholder="Makanannya enak? Tempatnya nyaman? Ceritain di sini..." required></textarea>
            </div>

            <div class="form-group">
                <label for="review-photo">Tambahkan foto <span>(opsional, maksimal 5 foto)</span></label>
                <input type="file" id="review-photo" accept="image/*" multiple>
                <p class="photo-hint">Kamu bisa pilih beberapa foto sekaligus ♡</p>
            </div>

            <div id="photo-preview" class="photo-preview"></div>

            <button type="submit" class="submit-review-button">Simpan Review ♡</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script>
        window.selectedRating = 0;
        document.addEventListener("DOMContentLoaded", async function () {
            const restaurantId = localStorage.getItem("selectedRestaurantId");
            if (!restaurantId) {
                alert("Restoran tidak ditemukan.");
                window.location.href = "dashboard.html";
                return;
            }

            if (typeof supabaseClient !== "undefined") {
                const { data: restaurant } = await supabaseClient
                    .from("restaurants")
                    .select("id, name")
                    .eq("id", restaurantId)
                    .single();
                if (restaurant) {
                    document.getElementById("review-restaurant").textContent = restaurant.name;
                }
            }

            const stars = document.querySelectorAll(".star-rating button");
            const ratingText = document.getElementById("rating-text");
            stars.forEach(star => {
                star.addEventListener("click", function () {
                    window.selectedRating = Number(this.dataset.rating);
                    stars.forEach(item => {
                        item.textContent = Number(item.dataset.rating) <= window.selectedRating ? "★" : "☆";
                    });
                    if (ratingText) ratingText.textContent = window.selectedRating + " / 5";
                });
            });

            const photoInput = document.getElementById("review-photo");
            const photoPreview = document.getElementById("photo-preview");
            if (photoInput && photoPreview) {
                photoInput.addEventListener("change", function () {
                    photoPreview.innerHTML = "";
                    const files = Array.from(this.files).slice(0, 5);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const img = document.createElement("img");
                            img.src = e.target.result;
                            photoPreview.appendChild(img);
                        };
                        reader.readAsDataURL(file);
                    });
                });
            }

            const reviewForm = document.getElementById("review-form");
            reviewForm.addEventListener("submit", async function (event) {
                event.preventDefault();
                if (typeof supabaseClient === "undefined") {
                    alert("Koneksi database belum tersedia ♡");
                    return;
                }

                const rating = Number(window.selectedRating);
                if (!rating || rating < 1 || rating > 5) {
                    alert("Jangan lupa kasih rating dulu ♡");
                    return;
                }

                const text = document.getElementById("review-text").value.trim();
                if (!text) {
                    alert("Tulis review kamu dulu ya ♡");
                    return;
                }

                const submitButton = reviewForm.querySelector('button[type="submit"]');
                if (submitButton) {
                    submitButton.disabled = true;
                    submitButton.textContent = "Menyimpan...";
                }

                let authUser = await getCurrentAuthUser();
                let selectedUser = localStorage.getItem("selectedUser") || "Tamu";
                let userId = authUser?.id || null;

                const { data: review, error: reviewError } = await supabaseClient
                    .from("reviews")
                    .insert({
                        restaurant_id: restaurantId,
                        user_id: userId,
                        user_name: selectedUser,
                        rating: rating,
                        review_text: text
                    })
                    .select()
                    .single();

                if (reviewError) {
                    console.error("Review gagal disimpan:", reviewError);
                    alert("Review gagal disimpan ♡ " + reviewError.message);
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = "Simpan Review ♡";
                    }
                    return;
                }

                const files = photoInput ? Array.from(photoInput.files).slice(0, 5) : [];
                for (const file of files) {
                    try {
                        const fileName = (userId || 'guest') + "/" + Date.now() + "-" + Math.random().toString(36).substring(2, 8) + ".jpg";
                        const { error: uploadError } = await supabaseClient.storage.from("review-photos").upload(fileName, file, { contentType: "image/jpeg" });
                        if (!uploadError) {
                            await supabaseClient.from("review_photos").insert({
                                review_id: review.id,
                                photo_url: fileName
                            });
                        }
                    } catch (e) {
                        console.error("Upload error:", e);
                    }
                }

                alert("Review berhasil disimpan ♡");
                window.location.href = "restaurant.html";
            });
        });
    </script>
</body>
</html>
