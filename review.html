<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tambah Review — Satu Meja</title>

<link
    rel="stylesheet"
    href="style.css"
>
```

</head>

<body>

```
<!-- =========================
     NAVBAR
========================== -->

<header class="navbar">

    <button
        class="back-dashboard"
        type="button"
        onclick="window.location.href='restaurant.html'"
    >
        ← Kembali
    </button>

    <div class="nav-logo">
        Satu Meja
    </div>

</header>


<!-- =========================
     REVIEW FORM
========================== -->

<main class="review-page">

    <p class="small-title">
        OUR FOOD JOURNEY
    </p>

    <h1>
        Tambah Review ♡
    </h1>

    <p
        id="review-restaurant"
        class="review-restaurant-name"
    >
        Nama Restoran
    </p>


    <form id="review-form">

        <!-- =========================
             RATING
        ========================== -->

        <div class="form-group">

            <label>
                Kasih rating yuk
            </label>

            <div class="star-rating">

                <button
                    type="button"
                    data-rating="1"
                >
                    ☆
                </button>

                <button
                    type="button"
                    data-rating="2"
                >
                    ☆
                </button>

                <button
                    type="button"
                    data-rating="3"
                >
                    ☆
                </button>

                <button
                    type="button"
                    data-rating="4"
                >
                    ☆
                </button>

                <button
                    type="button"
                    data-rating="5"
                >
                    ☆
                </button>

            </div>

            <p id="rating-text">
                Belum ada rating
            </p>

        </div>


        <!-- =========================
             REVIEW TEXT
        ========================== -->

        <div class="form-group">

            <label for="review-text">
                Ceritain pengalamanmu
            </label>

            <textarea
                id="review-text"
                placeholder="Makanannya enak? Tempatnya nyaman? Ceritain di sini..."
                required
            ></textarea>

        </div>


        <!-- =========================
             FOTO
        ========================== -->

        <div class="form-group">

            <label for="review-photo">
                Tambahkan foto
                <span>
                    (opsional, maksimal 5 foto)
                </span>
            </label>

            <input
                type="file"
                id="review-photo"
                accept="image/*"
                multiple
            >

            <p class="photo-hint">
                Kamu bisa pilih beberapa foto sekaligus ♡
            </p>

        </div>


        <!-- =========================
             PHOTO PREVIEW
        ========================== -->

        <div
            id="photo-preview"
            class="photo-preview"
        ></div>


        <!-- =========================
             SUBMIT
        ========================== -->

        <button
            type="submit"
            class="submit-review-button"
        >
            Simpan Review ♡
        </button>

    </form>

</main>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


<!-- =========================
     RATING HANDLER
========================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            let selectedRating = 0;


            const stars =
                document.querySelectorAll(
                    ".star-rating button"
                );


            const ratingText =
                document.getElementById(
                    "rating-text"
                );


            stars.forEach(
                function (star) {

                    star.addEventListener(
                        "click",
                        function () {

                            selectedRating =
                                Number(
                                    this.dataset.rating
                                );


                            stars.forEach(
                                function (item) {

                                    const itemRating =
                                        Number(
                                            item.dataset.rating
                                        );


                                    item.textContent =
                                        itemRating <=
                                        selectedRating
                                            ? "★"
                                            : "☆";

                                }
                            );


                            if (ratingText) {

                                ratingText.textContent =
                                    selectedRating +
                                    " / 5";

                            }

                        }
                    );

                }
            );

        }
    );

</script>
```

</body>

</html>
