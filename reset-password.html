<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — Satu Meja</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing">

        <div class="card">

            <div class="logo">♡</div>

            <h1>Password Baru</h1>

            <p class="tagline">
                buat password baru untuk Satu Meja
            </p>

            <div class="divider"></div>

            <form id="reset-password-form">

                <label for="new-password">
                    Password baru
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Masukkan password baru"
                    minlength="6"
                    required
                >

                <label for="confirm-password">
                    Ulangi password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Ulangi password baru"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="login-button">
                    Simpan Password ♡
                </button>

            </form>

            <p id="reset-message"></p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>

</html>
