<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login — Satu Meja</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="landing">

        <div class="card">

            <div class="logo">♡</div>

            <h1 id="login-title">
                Welcome
            </h1>

            <p class="tagline">
                masuk ke Satu Meja
            </p>

            <div class="divider"></div>

            <form id="login-form">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <button type="submit"
                        class="login-button">

                    Masuk ♡

                </button>

            </form>

            <p id="login-message"></p>
            <button
    type="button"
    id="forgot-password-button"
    class="back-button">

    Lupa password?

</button>

            <button
                class="back-button"
                onclick="goBack()">

                ← Kembali

            </button>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    
</body>

</html>
